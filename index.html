<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>にっぽん都道府県マスター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf8ee; --ink:#2d2a26; --sub:#7a7166; --card:#ffffff; --line:#e7dfcf;
  --accent:#ff7a2f; --accent-d:#e2621a; --ok:#2fb36d; --ng:#e9524f; --sea:#dff0f7;
  --land:#f6efe0; --border:#9b8f7c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;background:var(--bg);color:var(--ink);font-weight:500}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
rt{font-size:.5em;font-weight:500;color:var(--sub)}
.screen{display:none;min-height:100%;flex-direction:column}
.screen.on{display:flex}

/* ---------- home ---------- */
#home{max-width:760px;margin:0 auto;padding:20px 16px 40px;gap:18px}
.hero{text-align:center;padding:10px 0 4px}
.hero h1{font-size:clamp(26px,6vw,40px);font-weight:900;margin:0;letter-spacing:.02em}
.hero h1 span{color:var(--accent)}
.hero p{margin:6px 0 0;color:var(--sub)}
.topbar{display:flex;justify-content:flex-end}
.toggle{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
.toggle .sw{width:36px;height:20px;border-radius:999px;background:#d8cfbf;position:relative;transition:.2s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on .sw{background:var(--ok)}
.toggle.on .sw::after{left:18px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.mode{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:16px 14px;text-align:left;transition:transform .12s,border-color .12s;display:flex;flex-direction:column;gap:6px}
.mode:active{transform:scale(.97)}
.mode .ic{font-size:30px;line-height:1}
.mode b{font-size:19px;font-weight:900}
.mode small{color:var(--sub);font-size:13px;line-height:1.5}
.mode.sel{border-color:var(--accent);box-shadow:0 4px 0 var(--accent-d)}
.mode.zukan{border-style:dashed}
.settings{background:var(--card);border-radius:20px;padding:18px;border:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.row label.h{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:9px 14px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:700}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button:disabled{opacity:.35;cursor:default}
.start{background:var(--accent);color:#fff;font-size:22px;font-weight:900;padding:16px;border-radius:18px;box-shadow:0 5px 0 var(--accent-d);transition:transform .08s}
.start:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-d)}
.best{text-align:center;color:var(--sub);font-size:14px;min-height:1em}
.credit{text-align:center;font-size:11px;color:#a89e8f}
.credit a{color:inherit}

/* ---------- quiz / zukan layout ---------- */
#quiz,#zukan,#adv,#play{height:100vh;height:100dvh}
.qhead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:2px solid var(--line)}
.qhead .x{width:38px;height:38px;border-radius:50%;background:var(--bg);font-size:18px;font-weight:900}
.qhead .ttl{font-weight:900;font-size:16px;flex:1}
.prog{flex:1;height:12px;background:#efe7d6;border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .3s}
.cnt{font-weight:900;font-size:15px;min-width:54px;text-align:right}
.qbody{flex:1;display:flex;min-height:0}
.mapwrap{flex:1.25;min-height:0;position:relative;background:var(--sea);display:flex;flex-direction:column}
.slot{flex:1;min-height:0;position:relative}
.zoom{display:flex;gap:6px;padding:8px;overflow-x:auto;scrollbar-width:none}
.zoom::-webkit-scrollbar{display:none}
.zoom button{flex:none;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.85);border:2px solid #fff;font-size:13px;font-weight:700}
.zoom button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{flex:1;min-width:0;padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;background:var(--bg)}
@media (max-width:760px){
  #play .mapwrap{flex-basis:36%}
  .bossbar{padding:6px 10px}
  .qbody{flex-direction:column}
  .mapwrap{flex:0 0 42%}
  .panel{flex:1 1 auto;min-height:0;padding:12px}
  .mode b{font-size:16px}
  .mode .ic{font-size:26px}
}

/* map */
#map{width:100%;height:100%;display:block;touch-action:manipulation}
#map .prefecture{fill:var(--land);stroke:var(--border);stroke-width:.8;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .2s}
#map .boundary-line{stroke:#9fb7c2;stroke-width:1;vector-effect:non-scaling-stroke;fill:none}
#map.tappable .prefecture{cursor:pointer}
#map.tappable .prefecture:hover{fill:#ffe2c6}
#map .prefecture.target{fill:var(--accent)}
#map .prefecture.correct{fill:var(--ok)}
#map .prefecture.wrong{fill:var(--ng)}
#map .prefecture.done{fill:#cfe9d8}
#map .prefecture.dim{fill:#ece6da;stroke:#c9bfae}
#ring{fill:none;stroke:var(--accent);stroke-width:3;vector-effect:non-scaling-stroke;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:pulse 1.2s ease-in-out infinite}
#ring.ok{stroke:var(--ok)}
#ring.hide{display:none}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.45}}
#map.region-colors .prefecture{fill:var(--rc)}
#map.region-colors .prefecture.sel{fill:var(--accent)}

/* question */
.prompt{font-size:clamp(20px,4.6vw,28px);font-weight:900;line-height:1.5;text-align:center;padding:4px 0}
.prompt .big{color:var(--accent-d);font-size:1.15em}
.prompt small{display:block;font-size:14px;color:var(--sub);font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.eight{grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:12px 8px;font-size:clamp(17px,3.8vw,21px);font-weight:900;box-shadow:0 4px 0 var(--line);transition:transform .08s;line-height:1.6;display:flex;align-items:center;justify-content:center;gap:6px}
.opts.eight .opt{font-size:16px;padding:9px 6px}
.opt .dot{width:12px;height:12px;border-radius:50%;flex:none}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 0 #1f8a50}
.opt.ng{background:var(--ng);border-color:var(--ng);color:#fff;box-shadow:0 4px 0 #b83a37}
.opt:disabled{cursor:default}
.opt.fade{opacity:.4}
.fb{display:none;border-radius:16px;padding:12px 14px;background:var(--card);border:3px solid var(--line);gap:8px;flex-direction:column}
.fb.on{display:flex;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.fb .verdict{font-size:22px;font-weight:900}
.fb.good{border-color:var(--ok)} .fb.good .verdict{color:var(--ok)}
.fb.bad{border-color:var(--ng)} .fb.bad .verdict{color:var(--ng)}
.info{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:16px;line-height:1.7}
.info dt{color:var(--sub);font-size:13px;font-weight:700;align-self:center}
.info dd{margin:0;font-weight:900}
.next{background:var(--ink);color:#fff;font-size:18px;font-weight:900;padding:12px;border-radius:14px}
.hint{text-align:center;color:var(--sub);font-size:14px}

/* result */
#result{max-width:640px;margin:0 auto;padding:30px 16px 40px;gap:16px;text-align:center}
.score{font-size:64px;font-weight:900;line-height:1}
.score small{font-size:24px;color:var(--sub)}
.stars{font-size:40px;letter-spacing:6px}
.msg{font-size:20px;font-weight:900}
.newbest{display:inline-block;background:#ffe36e;padding:4px 12px;border-radius:999px;font-weight:900;font-size:14px}
.wronglist{background:var(--card);border-radius:16px;border:2px solid var(--line);padding:12px 16px;text-align:left}
.wronglist h3{margin:0 0 6px;font-size:15px;color:var(--ng)}
.wronglist li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:16px;line-height:1.7}
.wronglist li:last-child{border:none}
.wronglist ul{list-style:none;margin:0;padding:0}
.btns{display:flex;flex-direction:column;gap:10px}
.sub{background:var(--card);border:2px solid var(--line);font-size:17px;font-weight:900;padding:13px;border-radius:16px}

/* zukan */
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:14px}
.legend button.on{border-color:var(--ink)}
.legend i{width:14px;height:14px;border-radius:50%}
.zcard{background:var(--card);border-radius:16px;border:3px solid var(--line);padding:14px}
.zcard .nm{font-size:30px;font-weight:900;line-height:1.5}
.zcard .empty{color:var(--sub);text-align:center;padding:18px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:900;font-size:14px}
.list{display:flex;flex-wrap:wrap;gap:6px}
.list button{padding:5px 10px;border-radius:10px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:14px}
.list button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- adventure ---------- */
.mode.adv{grid-column:1/-1;border-color:#e9524f;background:#fff3ea;flex-direction:row;align-items:center;gap:14px}
.mode.adv .ic{font-size:46px}
.mode.adv .new{background:#e9524f;color:#fff;font-size:12px;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.ch{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg,#efe9dd);flex:none;width:1em;height:1em;vertical-align:middle}
.ch .em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:.62em;line-height:1}
.ch .face{position:absolute;left:50%;transform:translateX(-50%);top:var(--fy,58%);width:.42em;height:.2em;pointer-events:none}
.ch .face i{position:absolute;top:0;width:.074em;height:.094em;border-radius:50%;background:#2d2a26}
.ch .face i::after{content:"";position:absolute;top:.014em;left:.014em;width:.027em;height:.027em;border-radius:50%;background:#fff}
.ch .face i.l{left:.08em}.ch .face i.r{right:.08em}
.ch .face b{position:absolute;left:50%;top:.088em;transform:translateX(-50%);width:.094em;height:.045em;border:.02em solid #2d2a26;border-top:none;border-radius:0 0 .08em .08em}
.ch .face u{position:absolute;top:.08em;width:.08em;height:.047em;border-radius:50%;background:#ff8fa3;opacity:.85}
.ch .face u.l{left:0}.ch .face u.r{right:0}
.ch.shadow .em{filter:brightness(0) opacity(.7)}
.ch.shadow .face{display:none}
#map .prefecture.got{fill:var(--rc)}
#marks text{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.party{display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 10px;min-height:52px}
.party .lbl{font-size:13px;color:var(--sub);font-weight:700;margin-right:6px}
.regs{display:flex;flex-wrap:wrap;gap:6px}
.regs span{padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:#ece6da;color:#a89e8f}
.regs span.open{background:var(--ink);color:#fff}
.stages{display:flex;flex-direction:column;gap:8px}
.stg{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 12px;text-align:left;font-size:17px;font-weight:900}
.stg .st{margin-left:auto;font-size:13px;font-weight:700;color:var(--sub)}
.stg.cur{border-color:var(--accent);box-shadow:0 4px 0 var(--accent-d);animation:bob 1.6s ease-in-out infinite}
.stg.lock{opacity:.5}
.stg.boss{background:#2d2a26;color:#fff;border-color:#e9524f}
.stg.boss .st{color:#ffb4a6}
.stg.boss.lock{opacity:.45}
.stg.done .st{color:var(--ok)}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-2px)}}
.advfoot{display:flex;gap:8px}
.advfoot button{flex:1}
.stgst{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px}
.stgst .sm{font-size:13px;color:var(--sub);font-weight:700}
.dots{display:flex;gap:8px;margin-top:6px}
.dots i{width:22px;height:22px;border-radius:50%;background:#ece6da;border:2px solid #d8cfbf}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.bossbar{display:flex;align-items:center;gap:12px;background:#2d2a26;color:#fff;border-radius:16px;padding:10px 14px;position:relative}
.bossbar .bn{font-weight:900;font-size:17px}
.bossbar .hp{height:12px;background:#4a3a36;border-radius:999px;overflow:hidden;margin:6px 0 2px}
.bossbar .hp i{display:block;height:100%;background:#e9524f;transition:width .4s}
.bossbar .hpt{font-size:12px;color:#e8dfd2}
.bossbar .bb{flex:1}
.bossbar.hit .ch{animation:shake .45s}
.dmg{position:absolute;left:40px;top:-6px;font-size:26px;font-weight:900;color:#ffe36e;text-shadow:0 2px 0 #b83a37;animation:dmg .9s ease-out forwards;pointer-events:none}
@keyframes dmg{from{transform:translateY(10px);opacity:1}to{transform:translateY(-30px);opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-6deg)}40%{transform:translateX(6px) rotate(6deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.me{display:flex;align-items:center;justify-content:space-between;font-size:22px}
.me .buffs{font-size:15px;font-weight:900}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skills button{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:900}
.sklegend{font-size:12px;color:var(--sub);font-weight:700}
.skills button:disabled{opacity:.35;cursor:default}
body.hurt{animation:hurt .5s}
@keyframes hurt{0%,100%{box-shadow:inset 0 0 0 0 rgba(233,82,79,0)}30%{box-shadow:inset 0 0 0 14px rgba(233,82,79,.7)}}
#fbBtns{display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:900;z-index:60;animation:pop .25s ease-out;max-width:90vw;text-align:center}
#modal{position:fixed;inset:0;background:rgba(45,42,38,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
.mbox{background:var(--bg);border-radius:24px;padding:22px 20px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;animation:pop .3s ease-out;max-height:92vh;overflow-y:auto}
.mbox h2{margin:0;font-size:26px;font-weight:900}
.mbox p{margin:0;line-height:1.7}
#mBtns{display:flex;flex-direction:column;gap:8px}
.ncard{background:#fff;border:4px solid var(--c);border-radius:20px;padding:12px;text-align:center;position:relative}
.ncard .rar{position:absolute;top:8px;left:12px;font-size:12px;font-weight:900;color:var(--c)}
.ncard .no{position:absolute;top:8px;right:12px;font-size:12px;color:#a89e8f}
.ncard .nm{font-size:22px;font-weight:900;margin-top:6px}
.ncard .pf{display:inline-block;margin:4px 0;padding:2px 10px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:700}
.ncard .tx{font-size:13px;color:#5a5248;line-height:1.7;text-align:left;margin-top:4px}
.ncard .tx b{color:#2d2a26}
.ncard.locked{border-color:#d8cfbf}
.ncard.locked .nm{color:#a89e8f}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
#nz{max-width:900px;margin:0 auto;padding:0 0 30px}
#nz .inner{padding:16px;display:flex;flex-direction:column;gap:12px}
.ch .qm{font-size:.5em;font-weight:900;color:#b5aa98;line-height:1}
#marks text.q{font-family:inherit;font-weight:900;fill:#e2621a;stroke:#fff;stroke-width:4px;paint-order:stroke;vector-effect:none}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slotb{display:flex;align-items:center;gap:8px;background:var(--card);border:2px dashed #d8cfbf;border-radius:14px;padding:6px 8px;text-align:left;font-weight:900;font-size:15px;color:#a89e8f}
.slotb small{display:block;font-size:11px;font-weight:700;color:var(--sub)}
.slotb.got{border:2px solid var(--line);color:var(--ink)}
.diff{display:flex;align-items:center;gap:6px}
.diff span{font-size:13px;color:var(--sub);font-weight:700;margin-right:4px}
.diff button{padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:15px}
.diff button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.diff button[data-d=hard].on{background:#d9342b;border-color:#d9342b}
.hardnote{background:#fff0ec;border:2px solid #f3b3a6;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.7;color:#7a2a20}
.hardmode .qhead{background:#2d2a26;color:#fff;border-bottom-color:#d9342b}
.hardmode .qhead .x{background:#4a3a36;color:#fff}
.timer{position:relative;height:30px;background:#efe7d6;border-radius:999px;overflow:hidden}
.timer i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:999px}
.timer span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.timer.low i{background:var(--ng)}
.timer.low span{color:#fff;animation:pulse .5s infinite}
.bossbar.rage{background:#5a1d18;box-shadow:0 0 0 3px #e9524f}
.bossbar.rage .ch{animation:shake .8s infinite}
.ncard.gold{border-color:#e0b100;background:#fffbe6}
.ncard.gold .rar{color:#b88a00}
.ch.evo{box-shadow:0 0 0 .035em #f5c518,0 0 .16em .03em rgba(245,197,24,.75)}
.ch .acc{position:absolute;right:-.04em;bottom:-.02em;font-size:.3em;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.ch .spk{position:absolute;left:-.02em;top:-.04em;font-size:.26em;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1;animation:twk 1.4s ease-in-out infinite}
@keyframes twk{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.6}}
.ch .face s{position:absolute;top:-.05em;width:.085em;height:.022em;background:#2d2a26;border-radius:.02em}
.ch .face s.l{left:.065em;transform:rotate(20deg)}
.ch .face s.r{right:.065em;transform:rotate(-20deg)}
.ncard.gold{background:#fffbe6;box-shadow:0 0 0 3px #f5c518}
.evofrom{font-size:12px;color:#b88a00;font-weight:700}
.evoteaser{background:#fffbe6;border:2px dashed #f5c518;border-radius:14px;padding:8px 12px;font-size:13px;line-height:1.6;color:#6b5200}
.evoq{font-size:20px;line-height:1.7}
.evostage{padding:20px 0}
.evostage .ch{animation:evoflash 2.6s ease-in forwards}
@keyframes evoflash{0%{filter:none;transform:none}15%{transform:translateX(-4px)}20%{transform:translateX(4px)}30%{filter:brightness(1.8)}35%{filter:none}45%{filter:brightness(2.5);transform:scale(1.05)}50%{filter:none}60%{filter:brightness(3) saturate(0);transform:scale(1.1) rotate(-4deg)}65%{filter:none;transform:scale(1.1) rotate(4deg)}75%{filter:brightness(4) saturate(0);transform:scale(1.15)}85%{filter:brightness(6) saturate(0);transform:scale(1.2)}100%{filter:brightness(10) saturate(0);transform:scale(1.3)}}
.evoreveal{animation:pop .5s ease-out}
.pu{background:#fffbe6;border:2px solid #f5c518;border-radius:14px;padding:10px;font-size:15px;line-height:1.8}
.pu small{font-size:12px;color:#6b5200}
.skills button.evo{border-color:#f5c518;background:#fffbe6}
#map.nobound .boundary-line{display:none}
.chaps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chaps button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:12px;background:var(--card);border:2px solid var(--line);border-top:5px solid var(--cc,#ccc);font-size:13px;line-height:1.3}
.chaps button b{font-weight:900}
.chaps button small{font-size:11px;color:var(--sub);font-weight:700}
.chaps button.on{border-color:var(--ink);border-top-color:var(--cc,#ccc);background:#fff;box-shadow:0 3px 0 var(--ink)}
.chaps button.fin{border-top-color:#e9524f;background:#fff4f2}
.medals{display:flex;flex-wrap:wrap;gap:6px}
.medals span{padding:4px 10px;border-radius:999px;background:#ece6da;color:#a89e8f;font-size:13px;font-weight:900}
.medals span.got{background:#fff3c4;color:#6b5200}
.nzh{grid-column:1/-1;margin:10px 0 0;font-size:18px;font-weight:900;border-left:8px solid var(--cc);padding-left:10px}
.nzh small{font-size:13px;color:var(--sub)}
.sparkle{font-size:28px;letter-spacing:8px}

/* ---------- battle ---------- */
.arena{display:none}
#play.battle .arena{display:block;position:relative;flex:0 0 46%;min-height:230px;overflow:hidden;border-bottom:4px solid var(--ink);
  background:linear-gradient(#a9dcff 0%,#dff2ff 52%,var(--gr,#d6ecc4) 52%,var(--gr2,#a8d48a) 100%)}
#play.battle .arena.dark{background:linear-gradient(#2a1f3d 0%,#5b3a6e 52%,#4a3140 52%,#2d1f2a 100%)}
#play.battle .arena.rage{box-shadow:inset 0 0 40px rgba(233,82,79,.55)}
#play.battle #pStatus{display:none !important}
.cmds:empty{display:none}
@media (max-width:760px){
  #play.battle .arena{flex-basis:38%;min-height:210px}
  #play.battle .mapwrap{flex:0 0 30%}
}
.plat{position:absolute;border-radius:50%;background:rgba(40,60,20,.22)}
.dark .plat{background:rgba(0,0,0,.35)}
.en-plat{right:5%;top:40%;width:36%;height:11%}
.pf-plat{left:3%;bottom:24%;width:40%;height:12%}
.spr{position:absolute;line-height:1;transform-origin:bottom center}
.en-spr{right:12%;top:4%;filter:drop-shadow(0 6px 0 rgba(0,0,0,.15));animation:idle 2.2s ease-in-out infinite}
.en-spr .em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;display:block}
.pf-spr{left:9%;bottom:27%;animation:idle 2.6s ease-in-out infinite .4s}
.pf-spr .ch{box-shadow:0 6px 0 rgba(0,0,0,.12)}
@keyframes idle{0%,100%{translate:0 0}50%{translate:0 -4%}}
.rage .en-spr{animation:idle .7s ease-in-out infinite}
.ibox{position:absolute;background:#fffdf6;border:3px solid var(--ink);border-radius:12px 4px 12px 4px;padding:6px 10px;box-shadow:0 3px 0 rgba(0,0,0,.2);min-width:170px}
.en-info{left:3%;top:5%;width:min(46%,320px)}
.pf-info{right:3%;bottom:30%;width:min(44%,300px)}
.ibox .inm{font-weight:900;font-size:clamp(13px,2.2vw,17px);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibox .tag{font-size:10px;background:#e9524f;color:#fff;border-radius:4px;padding:1px 5px}
.hpb{display:flex;align-items:center;gap:6px;margin-top:4px}
.hpb span{font-size:11px;font-weight:900;color:#e2621a}
.hpb .bar{flex:1;height:10px;background:#5a514a;border-radius:999px;overflow:hidden;border:2px solid #5a514a}
.hpb i{display:block;height:100%;background:#3cc17a;border-radius:999px;transition:width .6s ease-out,background .3s}
.hpb i.mid{background:#f2c230}.hpb i.low{background:#e9524f}
.hpn{text-align:right;font-size:12px;font-weight:900;color:var(--sub)}
.hts{font-size:clamp(14px,2.4vw,20px);margin-top:2px;letter-spacing:1px}
.bf{font-size:11px;font-weight:900;color:var(--sub)}
.msgw{position:absolute;left:0;right:0;bottom:0;height:24%;min-height:58px;background:#fffdf6;border-top:4px solid var(--ink);display:flex;align-items:stretch}
.msg{flex:1;padding:8px 14px;font-size:clamp(14px,2.4vw,18px);font-weight:900;line-height:1.45;white-space:pre-line;overflow:hidden}
.cmds{display:flex;flex-direction:column;gap:4px;padding:6px;border-left:3px solid var(--line);justify-content:center}
.cmds button{background:var(--ink);color:#fff;font-weight:900;font-size:13px;padding:5px 10px;border-radius:8px;white-space:nowrap}
.bdmg{position:absolute;right:20%;top:12%;font-size:34px;font-weight:900;color:#fff;-webkit-text-stroke:2px #b83a37;text-shadow:0 3px 0 #b83a37;animation:dmg 1s ease-out forwards;pointer-events:none}
.bpop{position:absolute;inset:6px;background:rgba(255,253,246,.98);border:3px solid var(--ink);border-radius:14px;display:none;flex-direction:column;z-index:5}
.bpop.on{display:flex}
.pophead{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-weight:900;border-bottom:2px solid var(--line)}
.pophead button{width:30px;height:30px;border-radius:50%;background:var(--bg);font-weight:900}
.poplist{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;align-content:start}
.poplist button{display:flex;align-items:center;gap:8px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:5px 8px;font-size:14px}
.poplist button small{display:block;font-size:11px;color:var(--sub);font-weight:700}
.poplist button.cur{border-color:var(--accent)}
.poplist button:disabled{opacity:.4}
.lunge-r{animation:lungeR .42s ease-in-out !important}
@keyframes lungeR{0%,100%{transform:none}45%{transform:translate(70%,-55%) scale(1.05)}}
.lunge-l{animation:lungeL .42s ease-in-out !important}
@keyframes lungeL{0%,100%{transform:none}45%{transform:translate(-55%,45%) scale(1.08)}}
.hit{animation:blink .6s steps(2) !important}
@keyframes blink{0%,100%{opacity:1}20%,60%{opacity:.1}40%,80%{opacity:1}}
.guard{animation:guard .6s !important}
@keyframes guard{0%,100%{filter:none}50%{filter:drop-shadow(0 0 14px #5ab0ff) brightness(1.3)}}
.glow{animation:glowfx .9s !important}
@keyframes glowfx{0%,100%{filter:none;transform:none}50%{filter:drop-shadow(0 0 18px #ffd84a) brightness(1.4);transform:scale(1.1)}}
.enter-r{animation:enterR .6s ease-out !important}
@keyframes enterR{from{transform:translateX(140%)}to{transform:none}}
.enter-l{animation:enterL .45s ease-out !important}
@keyframes enterL{from{transform:translateX(-160%)}to{transform:none}}
.exit-l{animation:exitL .3s ease-in forwards !important}
@keyframes exitL{to{transform:translateX(-160%)}}
.faint{animation:faint 1s ease-in forwards !important}
@keyframes faint{to{transform:translateY(60%) scale(.6);opacity:0}}
.arena.shake{animation:shake .45s}
.ch.kage{background:#3b2f4a;box-shadow:0 0 0 .03em #6d5a85,0 0 .2em rgba(60,40,90,.5)}
.ch.kage .qm{color:#cdb8ff;font-size:.55em}
.ibox .tag.tg2{background:#7a5bb5}
</style>
</head>

<!-- ================= HOME ================= -->
<section id="home" class="screen on">
  <div class="topbar"><button class="toggle" id="furiBtn"><span class="sw"></span>ふりがな</button></div>
  <div class="hero">
    <h1>にっぽん<span>都道府県</span>マスター</h1>
    <p>47の都道府県をおぼえよう！</p>
  </div>
  <div class="modes" id="modes">
    <button class="mode adv" data-mode="adv"><span class="ic">⚔️</span><span style="display:flex;flex-direction:column;gap:4px"><b>ぼうけんモード<span class="new">NEW</span></b><small id="advSub">ご当地なかまを集めて、地方のボスをたおそう！</small></span></button>
    <button class="mode" data-mode="pref"><span class="ic">🗾</span><b>都道府県モード</b><small>地図の場所と名前をむすびつけよう</small></button>
    <button class="mode" data-mode="cap"><span class="ic">🏛️</span><b>県庁所在地モード</b><small>県庁がある都市をおぼえよう</small></button>
    <button class="mode" data-mode="region"><span class="ic">🧭</span><b>地方名モード</b><small>8つの地方に分けてみよう</small></button>
    <button class="mode zukan" data-mode="zukan"><span class="ic">📖</span><b>ずかん</b><small>地図をタッチしてしらべよう</small></button>
  </div>
  <div class="settings" id="settings">
    <div class="row" id="styleRow"><label class="h">もんだいの形</label><div class="seg" id="styleSeg"></div></div>
    <div class="row"><label class="h">出題はんい</label><div class="seg" id="rangeSeg"></div></div>
    <div class="row"><label class="h">もんだい数</label><div class="seg" id="countSeg"></div></div>
    <button class="start" id="startBtn">スタート！</button>
    <div class="best" id="bestTxt"></div>
  </div>
  <div class="credit">地図データ：<a href="https://github.com/geolonia/japanese-prefectures">Geolonia japanese-prefectures</a>（Wikipedia「日本地図.svg」ベース・GFDL）</div>
</section>

<!-- ================= QUIZ ================= -->
<section id="quiz" class="screen">
  <div class="qhead">
    <button class="x" id="quitBtn" aria-label="やめる">✕</button>
    <div class="prog"><i id="progBar"></i></div>
    <div class="cnt" id="cntTxt"></div>
  </div>
  <div class="qbody">
    <div class="mapwrap">
      <div class="zoom" id="qZoom"></div>
      <div class="slot" id="qSlot"></div>
    </div>
    <div class="panel">
      <div class="prompt" id="prompt"></div>
      <div class="opts" id="opts"></div>
      <div class="hint" id="hint"></div>
      <div class="fb" id="fb">
        <div class="verdict" id="verdict"></div>
        <dl class="info" id="fbInfo"></dl>
        <button class="next" id="nextBtn">つぎへ ▶</button>
      </div>
    </div>
  </div>
</section>

<!-- ================= RESULT ================= -->
<section id="result" class="screen">
  <div class="msg" id="resMode"></div>
  <div class="score" id="resScore"></div>
  <div class="stars" id="resStars"></div>
  <div class="msg" id="resMsg"></div>
  <div id="resBest"></div>
  <div class="wronglist" id="wrongBox"><h3>まちがえたもんだい</h3><ul id="wrongList"></ul></div>
  <div class="btns">
    <button class="start" id="retryWrongBtn">まちがえた問題をもう一度</button>
    <button class="sub" id="againBtn">もう一度チャレンジ</button>
    <button class="sub" id="homeBtn">ホームへもどる</button>
  </div>
</section>

<!-- ================= ZUKAN ================= -->
<section id="zukan" class="screen">
  <div class="qhead">
    <button class="x" id="zBack" aria-label="もどる">←</button>
    <div class="ttl">📖 都道府県ずかん</div>
  </div>
  <div class="qbody">
    <div class="mapwrap">
      <div class="zoom" id="zZoom"></div>
      <div class="slot" id="zSlot"></div>
    </div>
    <div class="panel">
      <div class="legend" id="legend"></div>
      <div class="zcard" id="zcard"></div>
      <div class="list" id="zList"></div>
    </div>
  </div>
</section>

<!-- ================= ADVENTURE MAP ================= -->
<section id="adv" class="screen">
  <div class="qhead">
    <button class="x" id="aBack" aria-label="もどる">←</button>
    <div class="ttl">⚔️ ぼうけんモード</div>
  </div>
  <div class="qbody">
    <div class="mapwrap"><div class="slot" id="aSlot"></div></div>
    <div class="panel" id="aPanel"></div>
  </div>
</section>

<!-- ================= ADVENTURE PLAY ================= -->
<section id="play" class="screen">
  <div class="qhead">
    <button class="x" id="pBack" aria-label="ぼうけんの地図へ">←</button>
    <div class="ttl" id="pTitle"></div>
  </div>
  <div class="arena" id="arena"></div>
  <div class="qbody">
    <div class="mapwrap"><div class="slot" id="pSlot"></div></div>
    <div class="panel">
      <div id="pStatus" style="display:flex;flex-direction:column;gap:8px"></div>
      <div class="timer" id="pTimer" style="display:none"><i></i><span></span></div>
      <div class="prompt" id="pPrompt"></div>
      <div class="opts" id="pOpts"></div>
      <div class="hint" id="pHint"></div>
      <div class="fb" id="pFb">
        <div class="verdict" id="pVerdict"></div>
        <dl class="info" id="pInfo"></dl>
        <div id="fbBtns"></div>
      </div>
    </div>
  </div>
</section>

<!-- ================= NAKAMA ZUKAN ================= -->
<section id="nz" class="screen">
  <div class="qhead">
    <button class="x" id="nzBack" aria-label="もどる">←</button>
    <div class="ttl">🃏 なかまずかん</div>
    <div class="cnt" id="nzCnt"></div>
  </div>

let actx=null;
function beep(ok){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = ok ? [784,1047] : [330,262];
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type = ok?'triangle':'square'; o.frequency.value=f;
      const t=actx.currentTime+i*0.11;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(ok?0.18:0.07,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.2);
    });
  }catch(e){}
}

/* ---------------- map geometry ---------------- */
const svg = $('map');
const ring = $('ring');
const G = {}; // code -> g element
svg.querySelectorAll('.prefecture').forEach(g=>{ G[+g.dataset.code]=g; });
let BOX = null; // computed lazily: {code:{main:{x,y,w,h}}}, regions, all
function rootMatrix(el){
  const chain=[]; let e=el;
  while(e && e!==svg){ if(e.transform && e.transform.baseVal.numberOfItems) chain.unshift(e.transform.baseVal.consolidate().matrix); e=e.parentNode; }
  let m = svg.createSVGMatrix(); chain.forEach(c=>{m=m.multiply(c)}); return m;
}
function bboxRoot(el){
  const b=el.getBBox(), m=rootMatrix(el), pt=svg.createSVGPoint();
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  [[b.x,b.y],[b.x+b.width,b.y],[b.x,b.y+b.height],[b.x+b.width,b.y+b.height]].forEach(([x,y])=>{
    pt.x=x;pt.y=y;const q=pt.matrixTransform(m);
    x1=Math.min(x1,q.x);y1=Math.min(y1,q.y);x2=Math.max(x2,q.x);y2=Math.max(y2,q.y);
  });
  return {x:x1,y:y1,w:x2-x1,h:y2-y1};
}
const union = bs=>{const x1=Math.min(...bs.map(b=>b.x)),y1=Math.min(...bs.map(b=>b.y));return {x:x1,y:y1,w:Math.max(...bs.map(b=>b.x+b.w))-x1,h:Math.max(...bs.map(b=>b.y+b.h))-y1}};
function computeBoxes(){
  if(BOX) return;
  BOX={pref:{},region:{}};
  P.forEach(p=>{
    const polys=[...G[p.code].querySelectorAll('polygon,path,polyline')];
    let main=null, best=-1;
    polys.forEach(pl=>{
      // a <path> may hold many islands as subpaths: measure each one separately
      const parts = pl.tagName==='path' ? pl.getAttribute('d').split(/(?=[Mm])/).filter(s=>s.trim()) : [null];
      parts.forEach(d=>{
        let el=pl, tmp=null;
        if(d && parts.length>1){ tmp=document.createElementNS('http://www.w3.org/2000/svg','path'); tmp.setAttribute('d',d); pl.parentNode.appendChild(tmp); el=tmp; }
        const b=bboxRoot(el); if(tmp) tmp.remove();
        const a=b.w*b.h; if(a>best){best=a;main=b}
      });
    });
    BOX.pref[p.code]={main, all:bboxRoot(G[p.code])};
  });
  REGIONS.forEach(r=>{
    BOX.region[r.k]=union(P.filter(p=>p.region===r.k).map(p=>BOX.pref[p.code].main));
  });
  BOX.all = union(P.map(p=>BOX.pref[p.code].all));
}
let curView='all';
function setView(key){
  computeBoxes(); curView=key;
  let b = key==='all' ? BOX.all : BOX.region[key];
  const pad = key==='all' ? 10 : Math.max(b.w,b.h)*0.12+12;
  svg.setAttribute('viewBox',`${b.x-pad} ${b.y-pad} ${b.w+pad*2} ${b.h+pad*2}`);
  document.querySelectorAll('.zoom button').forEach(btn=>btn.classList.toggle('on',btn.dataset.v===key));
}
function showRing(code, ok){
  computeBoxes();
  const b=BOX.pref[code].main;
  const r=Math.max(b.w,b.h)/2+10;
  ring.setAttribute('cx',b.x+b.w/2); ring.setAttribute('cy',b.y+b.h/2);
  ring.setAttribute('rx',Math.max(r,b.w/2+10)); ring.setAttribute('ry',Math.max(r,b.h/2+10));
  ring.classList.remove('hide'); ring.classList.toggle('ok',!!ok);
}
function hideRing(){ ring.classList.add('hide'); }
function clearMap(){

function buildZoom(container){

/* ---------------- quiz ---------------- */
function startQuiz(targets){
  const pool=inRange(S.range);
  const n = S.count==='all'?pool.length:Math.min(S.count,pool.length);
  const list = targets ? shuffle(targets) : shuffle(pool).slice(0,n).map(p=>p.code);
  Q={mode:S.mode, style:S.style[S.mode], range:S.range, list, i:0, score:0, wrong:[], retry:!!targets};
  show('quiz'); mountMap($('qSlot')); buildZoom($('qZoom'));
  $('qZoom').style.display = Q.style==='tap' ? '' : 'none';
  requestAnimationFrame(renderQ);
}
function pickDistractors(target, field){
  const t=BY[target];
  const seen=new Set([t[field]]);
  const same=shuffle(P.filter(p=>p.region===t.region&&p.code!==target));
  const other=shuffle(P.filter(p=>p.region!==t.region));
  const out=[];
  for(const p of [...same.slice(0,2),...other,...same.slice(2)]){
    if(out.length>=3) break;
    if(seen.has(p[field])) continue; seen.add(p[field]); out.push(p);
  }
  return out;
}
function renderQ(){
  clearMap();
  const code=Q.list[Q.i], t=BY[code];
  Q.answered=false;
  $('progBar').style.width=(Q.i/Q.list.length*100)+'%';
  $('cntTxt').textContent=`${Q.i+1} / ${Q.list.length}`;
  $('fb').className='fb'; $('hint').textContent='';
  // view: zoom to range region (except tap mode on all, where kids can zoom themselves)
  setView(Q.range);
  const opts=$('opts'); opts.className='opts'; opts.innerHTML='';
  let html='';
  if(Q.mode==='pref' && Q.style==='choose'){
    mark(code,'target'); showRing(code);
    $('prompt').innerHTML=`<small>オレンジ色の都道府県は？</small>ここはどこ？`;
    const choices=shuffle([t,...pickDistractors(code,'name')]);
    html=choices.map(p=>`<button class="opt" data-v="${p.code}">${rb(p.name,p.kana)}</button>`).join('');
  } else if(Q.mode==='pref' && Q.style==='tap'){
    svg.classList.add('tappable');
    $('prompt').innerHTML=`<span class="big">${rb(t.name,t.kana)}</span>は<br>どこかな？`;
    $('hint').textContent='地図をタップしてね（上のボタンで拡大できるよ）';
  } else if(Q.mode==='cap' && Q.style==='p2c'){
    mark(code,'target'); showRing(code);
    $('prompt').innerHTML=`<span class="big">${rb(t.name,t.kana)}</span>の<br>${rb('県庁所在地','けんちょうしょざいち')}は？`;
    const choices=shuffle([t,...pickDistractors(code,'cap')]);
    html=choices.map(p=>`<button class="opt" data-v="${p.code}">${rb(p.cap,p.capKana)}</button>`).join('');
  } else if(Q.mode==='cap' && Q.style==='c2p'){
    $('prompt').innerHTML=`${rb('県庁所在地','けんちょうしょざいち')}が<br><span class="big">${rb(t.cap,t.capKana)}</span>なのは？`;
    const choices=shuffle([t,...pickDistractors(code,'name')]);
    html=choices.map(p=>`<button class="opt" data-v="${p.code}">${rb(p.name,p.kana)}</button>`).join('');
  } else if(Q.mode==='region'){
    mark(code,'target'); showRing(code);
    $('prompt').innerHTML=`<span class="big">${rb(t.name,t.kana)}</span>は<br>何地方？`;
    opts.classList.add('eight');
    html=REGIONS.map(r=>`<button class="opt" data-v="${r.k}"><i class="dot" style="background:${r.c}"></i>${rb(r.n,r.kana)}</button>`).join('');
  }
  opts.innerHTML=html;
}
$('opts').onclick=e=>{const b=e.target.closest('.opt'); if(!b||Q.answered) return; answer(b.dataset.v, b);};
svg.addEventListener('click',e=>{
  const g=e.target.closest('.prefecture'); if(!g) return;
  const code=+g.dataset.code;
  if($('quiz').classList.contains('on')){
    if(Q && Q.style==='tap' && Q.mode==='pref' && !Q.answered) answer(code);
  } else if($('zukan').classList.contains('on')) zSelect(code);
  else if($('adv').classList.contains('on')) advGo(code);
  else if($('play').classList.contains('on') && A && A.q && A.q.tap && !A.answered) answerPlay(code);
});
function answer(v, btn){
  Q.answered=true;
  const code=Q.list[Q.i], t=BY[code];
  const correctVal = Q.mode==='region' ? t.region : String(code);
  const ok = String(v)===String(correctVal);
  if(ok) Q.score++; else Q.wrong.push({code, picked:v});
  beep(ok);
  // buttons
  document.querySelectorAll('#opts .opt').forEach(b=>{
    b.disabled=true;
    if(b.dataset.v===correctVal) b.classList.add('ok');
    else if(b===btn) b.classList.add('ng');
    else b.classList.add('fade');
  });
  // map
  G[code].classList.remove('target');
  if(Q.mode==='region'){ G[code].style.setProperty('--rc',RMAP[t.region].c); }
  mark(code,'correct'); showRing(code,true);
  if(!ok && Q.mode!=='region' && BY[+v]) mark(+v,'wrong');
  svg.classList.remove('tappable');
  if(Q.style==='tap' && !ok && curView!=='all' && curView!==t.region) setView(t.region);
  // feedback
  $('hint').textContent='';
  $('verdict').innerHTML = ok ? '⭕ せいかい！' : '❌ ざんねん…';
  $('fb').className='fb on '+(ok?'good':'bad');
  $('fbInfo').innerHTML = infoHTML(t, !ok && Q.style==='tap' && BY[+v] ? BY[+v] : null);
  $('nextBtn').textContent = Q.i+1<Q.list.length ? 'つぎへ ▶' : 'けっかを見る ▶';
  $('nextBtn').focus({preventScroll:true});
  $('fb').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function infoHTML(t, tapped){
  const r=RMAP[t.region];
  let h=`<dt>都道府県</dt><dd>${rbAlways(t.name,t.kana)}</dd>
  <dt>県庁所在地</dt><dd>${rbAlways(t.cap,t.capKana)}${t.code===13?' <small style="font-weight:500;color:var(--sub)">（都庁は新宿区）</small>':''}</dd>
  <dt>地方</dt><dd><span class="chip" style="background:${r.c}">${r.n}</span></dd>`;
  if(tapped) h+=`<dt>タップした所</dt><dd style="color:var(--ng)">${rbAlways(tapped.name,tapped.kana)}</dd>`;
  return h;
}

document.addEventListener('keydown',e=>{

function finish(){
  clearMap();
  const n=Q.list.length, s=Q.score, pct=s/n;
  $('resMode').textContent = MODES[Q.mode].name + (Q.retry?'（ふくしゅう）':'');
  $('resScore').innerHTML = `${s}<small> / ${n}</small>`;
  const stars = pct===1?3:pct>=.7?2:pct>=.4?1:0;
  $('resStars').textContent = '★'.repeat(stars)+'☆'.repeat(3-stars);
  $('resMsg').textContent = pct===1?'パーフェクト！すごい！🎉':pct>=.7?'よくできました！あと少し！':pct>=.4?'いいね！くりかえしておぼえよう':'だいじょうぶ、ずかんで見てからもう一度！';
  let nb='';
  if(!Q.retry){
    const k='best:'+`${Q.mode}-${Q.style}-${Q.range}-${S.count}`;
    const best=store.get(k,null);
    if(!best || s/n > best.s/best.n){ store.set(k,{s,n}); if(best) nb='<span class="newbest">🏆 さいこう記録こうしん！</span>'; }
  }
  $('resBest').innerHTML=nb;
  $('wrongBox').style.display = Q.wrong.length?'':'none';
  $('wrongList').innerHTML = Q.wrong.map(w=>{
    const t=BY[w.code], r=RMAP[t.region];
    let ans = Q.mode==='cap' ? `${rbAlways(t.name,t.kana)} → <b>${rbAlways(t.cap,t.capKana)}</b>`
            : Q.mode==='region' ? `${rbAlways(t.name,t.kana)} → <b>${r.n}</b>`
            : `<b>${rbAlways(t.name,t.kana)}</b>（${r.n}）`;
    return `<li>${ans}</li>`;
  }).join('');
  $('retryWrongBtn').style.display = Q.wrong.length?'':'none';
  show('result');
}

let okiOrig=null, okiOn=false;
function okiShift(on){
  computeBoxes();
  if(okiOrig===null){ okiOrig=G[47].getAttribute('transform')||''; BOX.okiOrig={pref:BOX.pref[47]}; }
  if(on===okiOn) return; okiOn=on;
  if(!on){ G[47].setAttribute('transform',okiOrig); BOX.pref[47]=BOX.okiOrig.pref; return; }
  const kg=BOX.pref[46].main, ok=BOX.okiOrig.pref.main;
  const dx=(kg.x-ok.w*0.6)-ok.x, dy=(kg.y+kg.h+18)-ok.y;
  const m=rootMatrix(G[47].parentNode), s=m.a||1;
  G[47].setAttribute('transform',`translate(${dx/s},${dy/s}) ${okiOrig}`);
  const sh=b=>({x:b.x+dx,y:b.y+dy,w:b.w,h:b.h});
  BOX.pref[47]={main:sh(ok),all:sh(BOX.okiOrig.pref.all)};
}

  curView='adv-'+ch.k;

}

/* ----- timer (hard) ----- */
let TM=null;
function stopTimer(){ if(TM){ clearInterval(TM); TM=null; } }
let TEND=0, TTOT=10, TPAUSE=null;
function startTimer(sec,total=sec){
  stopTimer(); const el=$('pTimer'); el.style.display='';
  const end=performance.now()+sec*1000; TEND=end; TTOT=total;
  const tick=()=>{
    const left=Math.max(0,end-performance.now());
    el.querySelector('i').style.width=(left/(total*10))+'%';
    el.querySelector('span').textContent=`⏰ ${Math.ceil(left/1000)}びょう`;
    el.classList.toggle('low',left<3000);
    if(left<=0){ stopTimer(); if(A&&!A.answered){ A.timeout=true; answerPlay(-1); } }
  };
  tick(); TM=setInterval(tick,100);
}
// とくぎ・こうたいの えんしゅつ中は 時間を とめる
function pauseTimer(){ if(TM){ TPAUSE=Math.max(0,TEND-performance.now()); stopTimer(); } }

/* ----- questions ----- */
let A=null;
// まちがいの選択肢：同じ章の県 → それでも足りなければ近くの県
function distract(code, field, pool){
  const t=BY[code], seen=new Set([t[field]]), out=[];
  const near=nearest(code, P.map(p=>p.code).filter(c=>!pool.includes(c)));
  for(const c of [...shuffle(pool.filter(c=>c!==code)), ...near]){
    const p=BY[c];
    if(out.length>=3) break; if(p.code===code||seen.has(p[field])) continue;
    seen.add(p[field]); out.push(p);
  }
  return out;
}
function makeQ(type, code, pool){
  const t=BY[code], q={type,code,ans:code};
  const nameOpts = ()=>shuffle([t,...distract(code,'name',pool)]).map(p=>({v:p.code,h:rb(p.name,p.kana)}));
  if(type==='shape'){
    q.prompt=`<small>なぞの県の しょうたいは？</small>光っている県の名前は？`; q.hl=true; q.opts=nameOpts();
  } else if(type==='nb'){
    const ans=shuffle(NB[code])[0], wrong=shuffle(nonNBnear(code).slice(0,5)).slice(0,3);
    Object.assign(q,{base:code,code:ans,ans,hl:true});
    q.prompt=`<span class="big">${rb(t.name,t.kana)}</span>の<br>となりの県は どれ？`;
    q.opts=shuffle([ans,...wrong]).map(c=>({v:c,h:rb(BY[c].name,BY[c].kana)}));
  } else if(type==='nnb'){
    const ans=shuffle(nonNBnear(code).filter(x=>x!==1&&x!==47).slice(0,4))[0], wrong=shuffle(NB[code]).slice(0,3);
    Object.assign(q,{base:code,code:ans,ans,hl:true});
    q.prompt=`<span class="big">${rb(t.name,t.kana)}</span>と<br>となり合って<span style="color:var(--ng)">いない</span>県は？`;
    q.opts=shuffle([ans,...wrong]).map(c=>({v:c,h:rb(BY[c].name,BY[c].kana)}));
  } else if(type==='name'){
    q.prompt=`<small>光っている都道府県は？</small>ここはどこ？`; q.hl=true; q.opts=nameOpts();
  } else if(type==='p2c'){
    q.prompt=`<span class="big">${rb(t.name,t.kana)}</span>の<br>${rb('県庁所在地','けんちょうしょざいち')}は？`; q.hl=true;
    q.opts=shuffle([t,...distract(code,'cap',pool)]).map(p=>({v:p.code,h:rb(p.cap,p.capKana)}));
  } else if(type==='c2p'){
    q.prompt=`${rb('県庁所在地','けんちょうしょざいち')}が<br><span class="big">${rb(t.cap,t.capKana)}</span>なのは？`; q.opts=nameOpts();
  } else {
    q.prompt=`<span class="big">${rb(t.name,t.kana)}</span>は<br>どこかな？`; q.tap=true;
  }
  return q;
}

/* ----- stage ----- */
function startStage(code){
  A={kind:'stage',code,step:0,ch:CH(),hp:3,max:3,paused:true,busy:true,reveal:false}; pickThird();
  A.partner=pickPartner();
  show('play'); $('play').classList.add('battle'); mountMap($('pSlot'));
  $('pTitle').textContent= (isHard()?'🔥 ':'') + (has(code) ? `${BY[code].name}（れんしゅう）` : `🔍 ${A.ch.n}の なぞの県`);
  $('pPrompt').innerHTML=''; $('pOpts').innerHTML=''; $('pHint').textContent=''; $('pFb').className='fb'; $('pTimer').style.display='none';
  buildArena();
  requestAnimationFrame(async ()=>{
    clearMap(); setAdvView(A.ch); paintBase(A.ch);
    const en=$('enSpr'), pf=$('pfSpr');
    anim(en,'enter-r',600);
    await say(has(code) ? `${cName(code)}が あらわれた！（れんしゅう）` : 'なぞの かげが あらわれた！');
    if(!has(code)) await say('3問 れんぞくで 正解すると\nしょうたいが わかるぞ！');
    pf.style.visibility=''; anim(pf,'enter-l',500);
    await say(`いけっ！ ${pName(A.partner)}！`);
    A.busy=false; A.paused=false; renderPlay();
  });
}
// 3問目：同じ章のほかの県から「地図タップ／県庁所在地→県／となりの県」のどれか
function pickThird(){
  const ord=A.ch.order, others=ord.filter(c=>c!==A.code), opts=[];
  others.forEach(c=>{ opts.push(['tap',c],['c2p',c]); });
  ord.forEach(c=>{ if(canNB(c)) opts.push(['nb',c],['nb',c]); if(canNNB(c)) opts.push(['nnb',c]); });
  A.third=shuffle(opts)[0];
}
function stageQ(){
  const pool=A.ch.order;
  if(A.step===0) return makeQ('shape',A.code,pool);
  if(A.step===1) return makeQ('p2c',A.code,pool);
  return makeQ(A.third[0],A.third[1],pool);
}
function stageStatus(){
  const got=has(A.code);
  return `<div class="stgst">${charaHTML(A.code,56,!got)}<div><div class="sm">${got?cName(A.code)+'と れんしゅう中':'なぞの県に なかまが かくれているみたい…<br>3問れんぞく正解で しょうたいが わかるよ'}</div><div class="dots">${[0,1,2].map(i=>`<i class="${i<A.step?'on':''}"></i>`).join('')}</div></div></div>`;
}

/* ----- boss ----- */
const atkBase = ()=> A.final ? 15+ADV.nakama.filter(isEvo).length : 15+evoCount(A.ch)*3;
const usesLeft = c=>(isEvo(c)&&CHARA[c].skill==='hint'?2:1) - A.used.filter(x=>x===c).length;
// ステージでは 集めた なかま全員、ボス戦では その地方の なかまで たたかう
function party(){ return (A.final||A.kind==='stage') ? ADV.nakama.slice() : A.ch.order.filter(has); }
function pickPartner(){
  const pt=party();
  if(ADV.partner!=null && pt.includes(ADV.partner)) return ADV.partner;
  const best=pt.sort((a,b)=>(isEvo(b)-isEvo(a))||(CHARA[b].rar-CHARA[a].rar))[0];
  return best==null ? 0 : best;
}
// なかまが まだいないときは「たんけんたいの きみ」が たたかう
const pName = c=>c===0?'たんけんたいの きみ':cName(c);
const pHTML = (c,size)=>c===0?`<span class="ch" style="font-size:${size}px;--bg:#ffe2c6"><span class="em">🧒</span></span>`:charaHTML(c,size);
function enemyHTML(size){
  if(A.kind==='boss') return `<span class="em" style="font-size:${size}px">${A.ch.boss.e}</span>`;
  if(A.reveal || has(A.code)) return charaHTML(A.code,size);

}
const enemyName = ()=>A.kind==='boss' ? A.ch.boss.n : (A.reveal||has(A.code)) ? cName(A.code) : 'なぞのかげ';
function startBoss(){
  const ch=CH(), base=ch.final?200:100, hp=isHard()?base*1.5:base;
  A={kind:'boss',ch,final:!!ch.final,hp,max:hp,hearts:3,power:0,shield:0,used:[],last:null,paused:true,rage:false,busy:true};
  if(A.final){
    // ラスボスでは とくぎを しゅるいごとに まとめる（しんかした なかまから先に・各3回まで）
    A.pools={};
    Object.keys(SKILLS).forEach(s=>{ A.pools[s]=ADV.nakama.filter(c=>CHARA[c].skill===s).sort((a,b)=>isEvo(b)-isEvo(a)).slice(0,3); });
  }
  A.partner=pickPartner();
  show('play'); $('play').classList.add('battle'); mountMap($('pSlot'));
  $('pTitle').textContent=(isHard()?'🔥 ':'')+(A.final?'ラスボスせん':`${ch.n}の ボスせん`);
  $('pPrompt').innerHTML=''; $('pOpts').innerHTML=''; $('pHint').textContent=''; $('pFb').className='fb'; $('pTimer').style.display='none';
  buildArena();
  requestAnimationFrame(async ()=>{
    clearMap(); setAdvView(ch); paintBase(ch);
    const en=$('enSpr'), pf=$('pfSpr');
    anim(en,'enter-r',600); await say(`${ch.boss.n}が あらわれた！`);
    if(A.final) await say('47都道府県 ぜんぶから 出題されるぞ！');
    if(isHard()) await say(`🔥ハード！ HP${hp}。1問10びょう。\nHPが半分をきると いかりモードに なるぞ！`);
    pf.style.visibility=''; anim(pf,'enter-l',500);
    await say(`いけっ！ ${pName(A.partner)}！`);
    A.busy=false; A.paused=false; renderPlay();
  });
}
function bossQ(){
  const ord=A.ch.order;
  let c; do{ c=ord[Math.random()*ord.length|0]; }while(c===A.last); A.last=c;
  let type=shuffle(A.rage?['tap','nb','nnb','c2p']:['name','p2c','c2p','tap','nb','nnb'])[0];
  if(type==='nb'&&!canNB(c) || type==='nnb'&&!canNNB(c)) type=A.rage?'tap':'name';
  return makeQ(type, c, A.final ? nearest(c,ord).slice(0,8) : ord);
}
function partyButtons(){
  if(A.final){
    return Object.keys(SKILLS).filter(s=>A.pools[s].length).map(s=>{
      const c=A.pools[s][0], n=A.pools[s].length;

    }).join('') || '<span class="sklegend">つかえる とくぎが ないよ</span>';
  }
  return A.ch.order.filter(has).map(c=>`<button class="${isEvo(c)?'evo':''}" data-c="${c}" ${usesLeft(c)<=0?'disabled':''} title="${cSk(c)}：${cSkD(c)}">${charaHTML(c,30)}${SKILLS[CHARA[c].skill].ic}${isEvo(c)&&CHARA[c].skill==='hint'&&usesLeft(c)>1?'×2':''}</button>`).join('');
}
/* ----- バトル画面 ----- */
let bTok=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function say(text){
  const el=$('bMsg'); if(!el) return Promise.resolve();
  const tok=++bTok; el.textContent='';
  return new Promise(res=>{
    const chars=[...text]; let i=0;
    const step=()=>{ if(tok!==bTok) return res(); if(i>=chars.length) return setTimeout(res,380); el.textContent+=chars[i++]; setTimeout(step,24); };
    step();
  });
}
function anim(el,cls,ms){ if(!el) return wait(0); el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); return wait(ms).then(()=>el.classList.remove(cls)); }
function buildArena(){

// 古い呼び出し名のまま使えるように

async function swapPartner(c, line){

function openPop(kind){

$('arena').onclick=async e=>{
  if(!A||!$('play').classList.contains('battle')) return;

  $('bPop').classList.remove('on');
  if(b.dataset.p){ A.busy=true; await swapPartner(+b.dataset.p); A.busy=false; resumeTimer(); return; }
  if(b.dataset.s){ const s=b.dataset.s, c=A.pools[s][0]; const r=await useSkill(c); if(r!==false && usesLeft(c)<=0) A.pools[s].shift(); resumeTimer(); return; }
  if(b.dataset.c){ await useSkill(+b.dataset.c); resumeTimer(); }
};
$('pStatus').onclick=e=>{
  const b=e.target.closest('.skills button'); if(!b||b.disabled||!A||A.kind!=='boss') return;
  if(b.dataset.s){ const s=b.dataset.s, c=A.pools[s][0]; if(useSkill(c)!==false && usesLeft(c)<=0) A.pools[s].shift(); renderBossStatus(); }
  else useSkill(+b.dataset.c);
};
async function useSkill(c){
  const s=CHARA[c].skill, evo=isEvo(c);
  if(A.busy) return false;
  if(s==='hint'){
    if(A.answered){ await say('もんだいが 出ているときに 使おう！'); return false; }
    if(A.q.opts){
      const wrong=shuffle([...document.querySelectorAll('#pOpts .opt')].filter(b=>+b.dataset.v!==A.q.ans&&!b.disabled)).slice(0,2);
      if(!wrong.length){ await say('もう へらせないよ！'); return false; }
      wrong.forEach(b=>{b.disabled=true;b.classList.add('fade')});
    } else {
      const keep=[A.q.ans,...nearest(A.q.ans, A.ch.order).slice(0,1)];
      P.forEach(p=>{ if(!keep.includes(p.code)) mark(p.code,'dim'); });
    }
  }
  if(s==='heal' && A.hearts>=5){ await say('ハートは もう いっぱいだ！'); return false; }
  A.used.push(c); A.busy=true;
  await swapPartner(c, `${cName(c)}、たのんだぞ！`);
  if(s==='heal') A.hearts=Math.min(5,A.hearts+(evo?2:1));
  if(s==='power') A.power=Math.max(A.power||0, evo?3:2);
  if(s==='shield') A.shield=(A.shield||0)+(evo?2:1);
  beep(true); anim($('pfSpr'),'glow',900); renderArena(false);
  await say(`${cName(c)}の 「${cSk(c)}」！\n${cSkD(c)}！`);
  A.busy=false;
}

/* ----- shared play ----- */
function renderPlay(){
  clearMap();
  NOFURI=isHard();
  const q = A.q = A.kind==='stage' ? stageQ() : bossQ();
  A.answered=false; A.timeout=false;
  const hc=q.base||q.code;
  // ラスボスでは、出題する県の地方を 大きく表示する（地図タップ・光る県のとき）
  if(A.final && (q.hl||q.tap)) setAdvView(chapterOf(q.tap?q.ans:hc)); else setAdvView(A.ch);
  paintBase(A.final ? (q.hl||q.tap ? chapterOf(q.tap?q.ans:hc) : FINAL) : A.ch);
  if(A.kind==='stage') $('pStatus').innerHTML=stageStatus(); else renderBossStatus();
  if(q.hl){ G[hc].classList.remove('got','dim'); mark(hc,'target'); if(!isHard()) showRing(hc); }
  if(q.tap) svg.classList.add('tappable');
  $('pPrompt').innerHTML=q.prompt;
  $('pOpts').className='opts';
  $('pOpts').innerHTML=q.opts?q.opts.map(o=>`<button class="opt" data-v="${o.v}">${o.h}</button>`).join(''):'';
  $('pHint').textContent=q.tap?'地図をタップしてね':'';
  $('pFb').className='fb';
  stopTimer(); $('pTimer').style.display='none';
  if(isHard() && !A.paused) startTimer(qSec(q));
  renderArena(false);
  say(A.kind==='boss' ? `${pName(A.partner)}は どうする？\n正解して こうげきだ！` : `${pName(A.partner)}は どうする？\nあと ${A.hp}問 正解で たおせるぞ！`);
}
$('pOpts').onclick=e=>{const b=e.target.closest('.opt'); if(b&&!b.disabled) answerPlay(+b.dataset.v,b);};
function answerPlay(v,btn){
  if(!A||A.answered) return; A.answered=true; stopTimer();
  const q=A.q, ok=v===q.ans, to=A.timeout?'⏰ 時間切れ！ ':'', ch=A.ch;
  beep(ok);
  document.querySelectorAll('#pOpts .opt').forEach(b=>{
    b.disabled=true;
    if(+b.dataset.v===q.ans) b.classList.add('ok'); else if(b===btn) b.classList.add('ng'); else b.classList.add('fade');
  });
  G[q.code].classList.remove('target','dim','got'); mark(q.code,'correct'); showRing(q.code,true);
  if(!ok && BY[v]){ G[v].classList.remove('dim','got'); mark(v,'wrong'); }
  svg.classList.remove('tappable'); $('pHint').textContent='';
  const btns=[]; let verdict;
  if(A.kind==='stage'){
    if(ok){
      A.step++; $('pStatus').innerHTML=stageStatus();
      if(A.step>=3){ verdict='⭕ 3問れんぞく正解！'; btns.push(['ステージクリア！ ▶',stageClear]); }
      else { verdict='⭕ せいかい！'; btns.push(['つぎへ ▶',renderPlay]); }
    } else {
      verdict=(to||'❌ ざんねん… ')+'1問目から やりなおし';
      btns.push(['もう一度 ちょうせん',()=>{A.step=0;A.hp=3;pickThird();renderPlay();}]);
      btns.push(['ぼうけんの地図へ',openAdv,'sub']);
    }
    stageTurn(ok,to);
  } else {
    verdict = ok ? '⭕ せいかい！' : (to||'❌ ざんねん…');
    battleTurn(ok, to);
    btns.push(['つぎへ ▶',bossNext]);
  }
  $('pVerdict').innerHTML=verdict;
  $('pFb').className='fb on '+(ok?'good':'bad');
  $('pInfo').innerHTML=infoHTML(BY[q.code], !ok&&q.tap&&BY[v]?BY[v]:null)
    + (q.base ? `<dt>となりの県</dt><dd>${BY[q.base].name}のとなり：${NB[q.base].map(c=>BY[c].name).join('・')}</dd>` : '');
  const fb=$('fbBtns'); fb.innerHTML='';
  btns.forEach(([l,fn,cls])=>{const b=document.createElement('button'); b.className=cls||'next'; b.textContent=l; b.onclick=()=>{ if(A&&A.busy) return; fn(); }; fb.appendChild(b);});
  $('pFb').scrollIntoView({block:'nearest',behavior:'smooth'});
}
async function battleTurn(ok, to){
  const ch=A.ch, en=$('enSpr'), pf=$('pfSpr'), pn=pName(A.partner);
  A.busy=true;
  const nb=$('fbBtns').querySelector('button'); if(nb) nb.disabled=true;
  if(ok){
    const mult=A.power||1, dmg=atkBase()*mult; A.power=0;
    await anim(pf,'lunge-r',420);
    A.hp=Math.max(0,A.hp-dmg); renderArena(false);
    const d=document.createElement('div'); d.className='bdmg'; d.textContent='-'+dmg; $('arena').appendChild(d); setTimeout(()=>d.remove(),1000);
    anim(en,'hit',600);
    await say(`${pn}の こうげき！${mult>1?`\n⚔️ パワーアップで ${mult}ばい！`:''} ${dmg}ダメージ！`);
  } else if(A.shield){
    A.shield--;
    await anim(en,'lunge-l',420); anim(pf,'guard',600); renderArena(false);
    await say(`${to}${ch.boss.n}の ${ch.boss.atk}！\n…でも 🛡️ガードで ふせいだ！`);
  } else {
    await anim(en,'lunge-l',420);
    A.hearts--; renderArena(false);
    anim($('arena'),'shake',450); anim(pf,'hit',600);
    document.body.classList.remove('hurt'); void document.body.offsetWidth; document.body.classList.add('hurt');
    await say(`${to}${ch.boss.n}の ${ch.boss.atk}！\n${pn}は ダメージを うけた！`);
  }
  if(isHard() && !A.rage && A.hp>0 && A.hp<=A.max/2){
    A.rage=true; renderArena(false); anim(en,'hit',600);
    await say(`💢 ${ch.boss.n}が おこった！\nもんだいが むずかしくなるぞ！`);
  }
  if(A.hp<=0){ en.classList.add('faint'); await say(`${ch.boss.n}を たおした！`); }
  else if(A.hearts<=0){ pf.classList.add('faint'); await say(`${pn}は たおれてしまった…`); }
  A.busy=false;
  if(nb) nb.disabled=false;
}
async function stageTurn(ok,to){
  const en=$('enSpr'), pf=$('pfSpr'), pn=pName(A.partner), first=!has(A.code);
  A.busy=true;
  if(ok){
    await anim(pf,'lunge-r',420);
    A.hp=3-A.step; renderArena(false); anim(en,'hit',600);
    const d=document.createElement('div'); d.className='bdmg'; d.textContent='HIT!'; $('arena').appendChild(d); setTimeout(()=>d.remove(),1000);
    if(A.step>=3){
      await say(`${pn}の こうげき！\n${enemyName()}を たおした！`);
      en.classList.add('faint'); await wait(800);
      if(first){
        A.reveal=true; en.classList.remove('faint'); sizeArena(); renderArena(false);
        evoSound(); anim(en,'glow',900);
        await say(`なぞのかげの しょうたいは…\n${BY[A.code].name}の ${CHARA[A.code].n}だった！`);
      }
    } else {
      await say(`${pn}の こうげき！\nあと ${A.hp}問で たおせるぞ！`);
    }
  } else {
    await anim(en,'lunge-l',420);
    anim($('arena'),'shake',450); anim(pf,'hit',600);
    A.hp=3; renderArena(false);
    await say(`${to}${enemyName()}の はんげき！\n${enemyName()}は げんきを とりもどした…`);
  }
  A.busy=false;
}
function bossNext(){
  if(A.busy) return;
  if(A.hp<=0) return bossWin();
  if(A.hearts<=0) return bossLose();
  renderPlay();
}
function stageClear(){
  const c=A.code, ch=A.ch, first=!has(c), newEvo=isHard()&&!isEvo(c);
  if(first){ ADV.nakama.push(c); saveAdv(); }
  const opened = first && !remaining(ch).length;
  const openMsg = `<p><b>${ch.n}の なかまが ${ch.order.length}人 そろった！<br>ボスへの道が ひらいたぞ！</b></p>`;
  const after = newEvo ? ()=>evolve(c, opened) : openAdv;
  if(first){
    modal(`<div class="sparkle">✨🎉✨</div><h2>なぞの県は<br>${BY[c].name}だった！</h2><p><b>${CHARA[c].n}</b>が なかまになった！</p>${newEvo?'':cardHTML(c)}${opened&&!newEvo?openMsg:''}`,
      [[newEvo?'……おや？ ▶':'ぼうけんの地図へ ▶',after]]);
  } else if(newEvo){
    evolve(c,false);
  } else {
    modal(`<div class="sparkle">✨🎉✨</div><h2>ステージクリア！</h2>${cardHTML(c)}`,[['ぼうけんの地図へ ▶',openAdv]]);
  }
}
function evoSound(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [523,659,784,1047,1319].forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*0.12;
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.4);
    });
  }catch(e){}
}
function evolve(c, opened){
  const ch=chapterOf(c);
  modal(`<p class="evoq">おや……？<br><b>${CHARA[c].n}</b>の ようすが……！</p><div class="evostage">${charaHTML(c,150,false,true)}</div>`,[]);
  setTimeout(()=>{
    ADV.hard.push(c); saveAdv(); evoSound();
    const s=CHARA[c].skill;
    modal(`<div class="sparkle">✨🌟✨</div><h2>${CHARA[c].n}は<br>${CHARA[c].evo.n}に<br>しんかした！</h2>
      <div class="pu">とくぎ パワーアップ！<br>${SKILLS[s].ic} ${CHARA[c].sk} → <b>${CHARA[c].evo.sk}</b><br><small>${SKILLS[s].d} → <b>${SKILLS_EVO[s]}</b></small><br>${ch.n}の ボスへの こうげき力 <b>+3</b></div>
      <div class="evoreveal">${cardHTML(c)}</div>${opened?`<p><b>${ch.n}の なかまが ${ch.order.length}人 そろった！<br>ボスへの道が ひらいたぞ！</b></p>`:''}`,
      [['ぼうけんの地図へ ▶',openAdv]]);
  }, 2600);
}
function bossWin(){
  const ch=A.ch, k=ch.k, first=!ADV.medals.includes(k);
  if(first) ADV.medals.push(k);
  const hardFirst=isHard()&&!ADV.medals.includes(k+'-hard');
  if(hardFirst) ADV.medals.push(k+'-hard');
  saveAdv();
  if(ch.final){
    modal(`<div class="sparkle">🎆🏆🎆</div><h2>${ch.boss.n}を<br>たおした！</h2><p><b>日本全国 せいは！</b><br>きみは 47都道府県の マスターだ！${hardFirst?'<br><b>👑 ハードでも せいは！ でんせつの マスター！</b>':''}</p>`,
      [['ぼうけんの地図へ ▶',openAdv]]);
    return;
  }
  const mc=medalCount();
  modal(`<div class="sparkle">${isHard()?'🎆👑🎆':'🎆🏅🎆'}</div><h2>${ch.boss.n}を<br>たおした！</h2><p>${ch.n}地方 ${isHard()?'ハード ':''}クリア！${first?`<br><b>${ch.n}メダル</b>を手に入れた！`:''}${hardFirst?`<br><b>👑 ${ch.n}ゴールドメダル</b>を手に入れた！`:''}</p>
    <p style="font-size:15px">${mc>=7?'<b>7つの メダルが そろった！<br>👿 全国ボスに いどめるぞ！</b>':`全国ボスまで あと ${7-mc}地方`}</p>`,
    [['ぼうけんの地図へ ▶',openAdv]]);
}
function bossLose(){
  modal(`${bossHTML(100,A.ch)}<h2>まけてしまった…</h2><p>なかまの「とくぎ」を うまく使うと 勝てるかも！<br>ずかんで 県を おさらいしよう。</p>`,
    [['もう一度 たたかう',startBoss],['ぼうけんの地図へ',openAdv,'sub']]);
}
$('pBack').onclick=()=>{ stopTimer(); openAdv(); };

/* ----- nakama zukan ----- */
function openNz(){
  show('nz'); $('nzCnt').textContent=`${ADV.nakama.length} / 47${ADV.hard.length?`　✨しんか ${ADV.hard.length}`:''}`;
  $('nzGrid').innerHTML=CHAPTERS.map(ch=>{
    const got=ch.order.filter(has);
    return `<h3 class="nzh" style="--cc:${chColor(ch)}">${ch.n} <small>${got.length}/${ch.order.length}${ADV.medals.includes(ch.k)?' 🏅':''}</small></h3>`+
      [...got,...ch.order.filter(c=>!has(c))].map(cardHTML).join('');
  }).join('');
}
$('nzBack').onclick=()=>openAdv();

/* ---------------- init ---------------- */
// keep the map rendered (not display:none) so getBBox works on first use
const park=document.createElement('div');
park.style.cssText='position:absolute;left:-9999px;top:0;width:400px;height:400px;visibility:hidden';
document.body.appendChild(park); park.appendChild(svg);
requestAnimationFrame(()=>{ try{computeBoxes()}catch(e){} });
renderHome();
</script>
